# Deploy na AWS (stack portal-mrk, o sistema legado). Mesmo arquivo nos cinco repositórios,
# mantido em claudiogsn/mrk-infra (templates/github-actions/deploy-portal-mrk.yml):
# portal-mrk, mobile-mrk, mrk-suporte-core, mrk-suporte-front e jobs-mrk.
#
# Variáveis do repositório (Settings > Secrets and variables > Actions > Variables),
# valores no output "portal_mrk_github_actions.<servico>" do Terraform (envs/prod):
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY, IMAGE_PARAMETER
#
# O servidor é Graviton: a imagem é linux/arm64. Go e Node compilam na arquitetura do runner
# (BUILDPLATFORM); só a imagem PHP (portal e mobile) instala extensões sob emulação (QEMU).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC com a AWS (sem access keys)
  contents: read

concurrency:
  group: deploy-prod-${{ github.repository }}
  cancel-in-progress: false

env:
  PROJECT: portal-mrk
  ENVIRONMENT: prod
  # Máquina onde a stack roda (tag Servidor da EC2).
  SERVIDOR: portal

jobs:
  deploy:
    # Sem as variáveis do repositório (infra ainda não aplicada), o deploy é pulado em vez de falhar.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Registrar a nova imagem
        run: |
          aws ssm put-parameter --overwrite --type String \
            --name "${{ vars.IMAGE_PARAMETER }}" \
            --value "${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"

      - name: Deploy no Docker Swarm
        run: |
          set -euo pipefail
          IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:SwarmRole,Values=manager" "Name=tag:Environment,Values=$ENVIRONMENT" "Name=tag:Servidor,Values=$SERVIDOR" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          [ -n "$IDS" ] || { echo "Nenhum manager encontrado (Servidor=$SERVIDOR)"; exit 1; }

          CMD_ID=$(aws ssm send-command --instance-ids $IDS \
            --document-name AWS-RunShellScript \
            --comment "deploy $PROJECT ${GITHUB_SHA::7}" \
            --parameters "{\"commands\":[\"/usr/local/bin/stack-deploy $PROJECT\"]}" \
            --query Command.CommandId --output text)

          for ID in $IDS; do
            for _ in $(seq 1 120); do
              STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" --query Status --output text 2>/dev/null || echo Pending)
              case "$STATUS" in
                Pending|InProgress|Delayed) sleep 5 ;;
                *) break ;;
              esac
            done
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" --query StandardOutputContent --output text
            if [ "$STATUS" != "Success" ]; then
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" --query StandardErrorContent --output text
              echo "Deploy falhou em $ID: $STATUS"
              exit 1
            fi
          done
